# Jig project configuration.
# Flat YAML subset: `section.key: value`, inline lists only, no nesting.
# Paths are NOT configurable: .ai/knowledge, .ai/workspace, .ai/runtime are fixed.
# Any key that is absent takes the default built into the scripts.
#
# Settings that are yours alone (the housekeeping.* keys and git.worktree_root)
# go in .ai/config.local.yaml: same format, gitignored, one file per clone. It
# wins over this file for those keys only; `jig status` shows what it changes.
# agent.git (none | commit | push | pr: how far the agent takes a finished task)
# is read from .ai/config.local.yaml only, never from this file.

profiles: [generic]                   # generic is always active
adapters: [claude, codex]

git.base_branch: main                 # merge target for ancestry checks
git.branch_per_task: true             # `jig task start` creates and checks out a branch
git.branch_template: task/{id}        # {id} is the task id; validated by git itself
# git.worktree_root: ../<project>.worktrees   # where `jig task start --worktree` puts worktrees
# worktree.carry: [.env.testing]        # extra paths copied into a new worktree, beyond profiles
#   never a directory holding its own git repository: removing the worktree deletes the copy
#   silently, with the work in it — see https://jig.fapost.in/working-with-tasks
forge: auto                           # auto | github | gitlab | none

housekeeping.cadence: 1d              # session hook runs housekeeping if last run is older
housekeeping.fetch: true              # allow `git fetch` during housekeeping
housekeeping.trash_ttl: 7d            # trash entries older than this are deleted
housekeeping.abandoned_ttl: 14d       # abandoned workspaces are purged after this
housekeeping.stale_after: 60d         # older active tasks are reported as STALE_CANDIDATE

knowledge.require_frontmatter: true   # `jig knowledge check` fails on missing frontmatter

# verify.full_run: local | ci. Set `ci` only when CI runs every check on each
# pull request: `jig verify` then checks what changed since git.base_branch
# and leaves the full set to CI. It still runs everything when CI is set or
# with --full.
# verify.full_run: local
