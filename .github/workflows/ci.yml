# Runs the suite on Linux as well as macOS.
#
# The reason this file exists: every portability helper in the scripts has two
# branches, and only one of them ever executes on the maintainer's machine.
# `stat -f %m` / `date -j` are the BSD halves used on macOS; `stat -c %Y` and
# `date -d` are the GNU halves that no local run has ever entered. The same
# applies to the linter — shellcheck's rule set moves between releases, so the
# version a distribution ships decides the verdict.
#
# Both are things a human is supposed to remember to check, which is exactly
# the kind of discipline this framework exists to remove.
name: ci

on:
  push:
    # An epic branch (epic/<id>, ADR-0040) is kept
    # current by merging `main` into it directly, without a pull request, so
    # a push is the only moment its own tests ever run.
    branches: [main, 'epic/**']
  pull_request:
  workflow_dispatch:
  # Every night the whole suite runs on main whatever changed: a mistake in the
  # verify map that lets a change skip the tests it needed shows up within a day.
  schedule:
    - cron: '17 3 * * *'

# Least privilege: the suite only reads the checkout. A public repository's
# workflow token defaults to more than this job needs.
permissions:
  contents: read

# A new push to the same branch makes the previous run's answer irrelevant —
# except on main, where a run ends in a release: two pull requests merged one
# after the other each get their tag, instead of the second cancelling the
# first one's release (it happened to 0.7.2). GitHub keeps one run pending per
# group; a third merge meanwhile replaces the pending one, and its own run tags
# the version then current, so a release comes later but is not lost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # How much of the suite this change needs (ADR-0041 as amended). A change
  # every path of which the verify map says affects no test — documentation,
  # knowledge, specs — gets the knowledge check only; anything else, or a
  # change that cannot be measured, gets everything. The rules live in
  # .github/scripts/ci-scope.sh, which has tests; this job only runs it.
  # A skipped job reads as passed to a required check, where `paths-ignore`
  # would leave the check waiting forever.
  #
  # A push is measured from the commit of the last successful run on its
  # branch, not from the previous tip: GitHub keeps one pending run per
  # group, so a merge during a run replaces the one queued before it, and
  # that one's changes would otherwise never be measured. Every success
  # covered the changes since the success before it, so nothing falls
  # between two runs.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide the scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            pull_request) line=$(.github/scripts/ci-scope.sh "$PR_BASE") ;;
            push)
              # Empty when there is no successful run yet, or the API cannot
              # answer: ci-scope.sh then runs everything.
              green=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" \
                -f branch="$BRANCH" -f status=success -f per_page=1 \
                --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) || green=""
              echo "last successful run on $BRANCH: ${green:-none}"
              line=$(.github/scripts/ci-scope.sh "$green")
              ;;
            *) line="full ($EVENT runs everything)" ;;
          esac
          echo "scope: $line"
          case "$line" in
            light*) echo "full=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "full=true" >> "$GITHUB_OUTPUT" ;;
          esac

          # Whether the Windows shards run, per
          # adr-20260924-windows-runs-on-a-pull-request-that-touches-platform-behaviour.
          # Only a pull request asks: main, the nightly run and a manual
          # dispatch run every platform whatever changed. The event check
          # lives here rather than on the job, which now reads one output.
          if [ "$EVENT" = pull_request ]; then
            win=$(.github/scripts/ci-windows-scope.sh "$PR_BASE")
          else
            win="windows ($EVENT runs every platform)"
          fi
          echo "windows: $win"
          case "$win" in
            skip*) echo "windows=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "windows=true" >> "$GITHUB_OUTPUT" ;;
          esac

  # The light scope: what a documentation change can still break is the
  # knowledge, so the repository's own knowledge is checked.
  knowledge:
    needs: scope
    if: needs.scope.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Knowledge check
        run: |
          scripts/jig knowledge check
          tests/run.sh knowledge::test_real_repository_knowledge_passes_with_no_failures

  test:
    name: ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms always report. A failure on one is information about
      # that platform, not a reason to cancel the other and lose the answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      # Printed, not asserted. The point is that a disagreement between
      # platforms is legible in the log rather than being a mystery — pinning
      # a version is impossible anyway, since jig has no dependency manager
      # (ADR-0002) and takes whatever the machine provides.
      - name: Toolchain versions
        run: |
          bash --version | head -n 1
          git --version
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version | sed -n 's/^version: /shellcheck /p'
          else
            echo "shellcheck: not installed"
          fi

      # The suite needs only the source checkout, git and bash — no install
      # step, because tests/run.sh resolves the framework from its own path.
      - name: Tests
        run: tests/run.sh

      # A smoke test of the *installed* copy, which is a different artefact
      # from the source tree the suite exercises: `init` into a scratch
      # project, then run the project's own gate there. On Linux this is also
      # the first time the GNU branches of the portability helpers
      # (`stat -c %Y`, `date -d`) actually execute.
      - name: Install into a scratch project and verify it
        run: |
          set -eu
          work=$(mktemp -d)
          git -C "$work" init -q .
          # Identity is set on the scratch repository only. `git config
          # --global` would be harmless on an ephemeral runner but this block
          # is also run by hand when someone debugs CI, and there it silently
          # rewrites the developer's own git identity for every repository on
          # the machine. It did exactly that once.
          git -C "$work" config user.name jig
          git -C "$work" config user.email jig@example.com
          git -C "$work" symbolic-ref HEAD refs/heads/main
          printf '# ci\n' > "$work/README.md"
          git -C "$work" add README.md
          git -C "$work" commit -q -m init
          cd "$work"
          "$GITHUB_WORKSPACE/scripts/jig" init --from "$GITHUB_WORKSPACE" --profiles generic,shell
          .ai/scripts/jig status
          .ai/scripts/jig verify
          .ai/scripts/jig housekeeping

  # The whole suite on Windows under Git Bash, with the git settings a Windows
  # user gets out of the box: core.autocrlf=true and no native symlinks, so
  # `ln -s` copies and links fall back to junctions. Every process start is
  # slow there, so the suite runs in three shares at once (JIG_TEST_SHARD) and
  # skips the one check that reads only this repository's own knowledge and says
  # nothing about the platform (JIG_TEST_SKIP; it still runs on Linux and macOS).
  # It runs on main (a release waits for every share), by hand, nightly, and on
  # a pull request whose diff touches something Windows decides differently —
  # line endings, MSYS path translation, directory links, a file that exists
  # only for Windows, or a change that names the platform itself. That
  # decision is .github/scripts/ci-windows-scope.sh, which has tests and a
  # header explaining the rules; the `scope` job runs it and this job reads
  # one output. Every other pull request is covered by smoke-windows below,
  # as every pull request was before.
  test-windows:
    name: windows-latest (Git Bash) ${{ matrix.shard }}/3
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          bash --version | head -n 1
          git --version
          git config --get core.autocrlf || true
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version | sed -n 's/^version: /shellcheck /p'
          else
            echo "shellcheck: not installed"
          fi

      # Real-time scanning inspects every process the suite starts, and it
      # starts tens of thousands. The runner is disposable; a runner image that
      # refuses the change only loses the speed-up, so it is not a failure.
      - name: Pause Defender real-time scanning
        shell: powershell
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true; Write-Output "Defender real-time scanning paused" }
          catch { Write-Output "Defender not paused: $($_.Exception.Message)" }

      - name: Tests
        env:
          JIG_TEST_SHARD: ${{ matrix.shard }}/3
          JIG_TEST_SKIP: knowledge::test_real_repository_knowledge_passes_with_no_failures
        run: tests/run.sh

  # What a Windows user runs, on every pull request: the installer end to end
  # (tests/install.t.ps1, in Windows PowerShell 5.1, which every Windows has)
  # and the everyday commands in a project, including a worktree whose
  # workspace link has to be a junction here.
  smoke-windows:
    name: windows-latest smoke (install.ps1)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Installer tests
        shell: powershell
        run: ./tests/install.t.ps1

      - name: Everyday commands in Git Bash
        shell: bash
        run: |
          set -eu
          work=$(mktemp -d)
          git -C "$work" init -q .
          git -C "$work" config user.name jig
          git -C "$work" config user.email jig@example.com
          git -C "$work" symbolic-ref HEAD refs/heads/main
          printf '# ci\n' > "$work/README.md"
          git -C "$work" add README.md
          git -C "$work" commit -q -m init
          cd "$work"
          "$GITHUB_WORKSPACE/scripts/jig" init --from "$GITHUB_WORKSPACE" --profiles generic,shell
          git add -A
          git commit -q -m "jig init"
          .ai/scripts/jig doctor
          .ai/scripts/jig upgrade --dry-run
          .ai/scripts/jig task new ci-demo --class T1 --domains core
          wt=$(.ai/scripts/jig task start ci-demo --worktree)
          .ai/scripts/jig task list
          # The worktree's workspace is a junction here: a landed, closed task
          # must leave neither the worktree directory nor its workspace behind.
          # Ancestry tells the branch's own commit from the base's by when each
          # ref moved, to the second, and a tie goes to the base (ADR-0032):
          # a script that starts, commits and merges within one second reads
          # its own work as foreign. tests/housekeeping.t.sh uses hk_tick.
          sleep 2
          printf 'work\n' > "$wt/ci-demo.txt"
          git -C "$wt" add ci-demo.txt
          git -C "$wt" commit -q -m "work for ci-demo"
          sleep 2
          git merge -q --ff-only task/ci-demo
          .ai/scripts/jig task set ci-demo knowledge_consolidated true
          .ai/scripts/jig task set ci-demo status consolidated
          .ai/scripts/jig housekeeping --verbose
          if [ -e "$wt" ]; then
            echo "worktree directory left behind: $wt"
            ls -la "$wt"
            exit 1
          fi
          test ! -e .ai/workspace/tasks/ci-demo
          echo "JIG_SMOKE_PROJECT=$(cygpath -w "$work")" >> "$GITHUB_ENV"

      # The native Codex path (REQ-5): jig from PowerShell through jig.cmd.
      - name: jig.cmd from PowerShell
        shell: powershell
        run: |
          Set-Location $env:JIG_SMOKE_PROJECT
          & .ai\scripts\jig.cmd status
          if ($LASTEXITCODE -ne 0) { throw "jig.cmd status exited $LASTEXITCODE" }
          & .ai\scripts\jig.cmd doctor
          if ($LASTEXITCODE -ne 0) { throw "jig.cmd doctor exited $LASTEXITCODE" }

  # Tags a release once the tests passed on every platform (ADR-0033). The tag
  # is v<JIG_VERSION>; a merge that did not bump the version finds its tag
  # already there and does nothing. The decision lives in
  # .github/scripts/release-tag.sh, which has tests; this job only runs it.
  #
  # Write access is granted to this job alone: the rest of the workflow keeps
  # `contents: read`. Pull requests and manual runs never tag.
  #
  # Only a full run tags: a light one tested nothing, and a version bump whose
  # own run was replaced in the queue waits for the next full run — the next
  # code merge or the nightly one — instead of being tagged untested.
  release:
    needs: [scope, test, test-windows, smoke-windows]
    if: >-
      !cancelled() && !failure() && needs.scope.outputs.full == 'true'
      && (github.event_name == 'push' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag the release if JIG_VERSION is new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/release-tag.sh

  # Gates a pull request from an epic branch into main (spec.md, failure
  # modes 6 and 7): such a merge must not land a version already released
  # from elsewhere (the release job would then find its tag and tag
  # nothing), and must not land before the epic's roadmap says it is
  # finished. The decision lives in .github/scripts/epic-pr-check.sh, which
  # has tests; this job only runs it. head_ref is passed through env, never
  # interpolated into the shell script, because it is attacker-controlled on
  # a pull request from a fork.
  epic-pr:
    needs: [scope, test]
    if: >-
      !cancelled() && !failure()
      && github.event_name == 'pull_request' && github.base_ref == 'main'
      && startsWith(github.head_ref, 'epic/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the epic is finished and its version is new
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: .github/scripts/epic-pr-check.sh "$HEAD_REF"

  # Refuses a pull request that releases a version the changelog does not
  # describe (docs/changelog.mdx). The decision lives in
  # .github/scripts/changelog-check.sh, which has tests; this job only runs
  # it. It is independent of the suite: the question is about the text of the
  # release, not about the code, and it should answer while the author is
  # still writing the pull request.
  #
  # The check turns itself on when a branch raises JIG_VERSION and off again
  # once that version is tagged, so a pull request that leaves the version
  # alone passes without reading the page.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the changelog describes the version this branch declares
        run: .github/scripts/changelog-check.sh

  # The one context a branch rule can require. A matrix job's name cannot be:
  # `test` is named ${{ matrix.os }}, and when `scope` skips it the expression
  # is never expanded, so GitHub reports a single skipped check called
  # `matrix.os` and a rule naming `ubuntu-latest` waits forever for a status
  # nobody will send — a pull request with a green CI that can never merge
  # (seen on #86). `test-windows` has the same shape.
  #
  # This job's name never changes, `always()` makes it report on every event,
  # and it gathers what the others ended as. A skipped job passes: skipping is
  # how `scope` says the change needed no run, and how a job declares itself
  # irrelevant to this event. Anything else — failure, cancellation — fails
  # here, so the rule blocks the merge while the suite is still running and
  # after it broke.
  ci-ok:
    needs: [scope, knowledge, test, test-windows, smoke-windows, changelog, epic-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gather the results of every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          # An empty list would pass the loop without checking anything, so an
          # expression that rendered to nothing fails here instead of reading
          # as a green suite.
          if [ -z "$(printf '%s' "$RESULTS" | tr -d ' ')" ]; then
            echo "ci-ok: no job results were reported"
            exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "ci-ok: a job ended as '$result'"; exit 1 ;;
            esac
          done
          echo "ci-ok: every job passed or was skipped"
