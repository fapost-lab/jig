# TEMPORARY discovery probe for task windows-support. Delete before merging.
#
# Collects the real failure list on windows-latest instead of guessing it from
# the code. Nothing here is asserted: every step records what happened and the
# job stays green, so one run yields the whole picture rather than the first
# failure.
#
# Two setups on the same runner image:
#   defaults   — git and Git Bash as a Windows user gets them out of the box:
#                core.autocrlf=true, `ln -s` copies instead of linking.
#   configured — what a Windows guide could tell the user to set: LF checkout,
#                core.symlinks=true, MSYS=winsymlinks:nativestrict.
# The difference between the two is the design question: what must be fixed
# in code, and what may be required in documentation.
name: windows-probe

on:
  push:
    branches: [task/windows-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: windows ${{ matrix.setup }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: defaults
            autocrlf: "true"
            symlinks: "false"
            msys: ""
          - setup: configured
            autocrlf: "input"
            symlinks: "true"
            msys: "winsymlinks:nativestrict"
    defaults:
      run:
        shell: bash
    env:
      MSYS: ${{ matrix.msys }}
      PROBE: ${{ github.workspace }}/probe-out
      # The suite takes ~25 minutes per setup and its result is already known
      # from the first run (defaults 83 failed, configured 40). Set to 1 to
      # run it again.
      PROBE_TESTS: "0"
      # The v1/v2 smoke steps answered their questions; v3 asks new ones.
      PROBE_SMOKE: "0"
      PROBE_V3: "0"

    steps:
      # Before checkout, so the checkout itself is made under this setup.
      # --global is acceptable on an ephemeral runner; do not copy this block
      # into anything run on a developer machine.
      - name: Configure git
        run: |
          git config --global core.autocrlf "${{ matrix.autocrlf }}"
          git config --global core.symlinks "${{ matrix.symlinks }}"

      - uses: actions/checkout@v4

      - name: Environment facts
        run: |
          set +e
          mkdir -p "$PROBE"
          {
            echo "== versions"
            bash --version | head -n 1
            git --version
            uname -a
            echo "OSTYPE=$OSTYPE MSYS=$MSYS"
            if command -v shellcheck >/dev/null 2>&1; then
              shellcheck --version | sed -n 's/^version: /shellcheck /p'
            else
              echo "shellcheck: not installed"
            fi
            echo "== git config"
            git config --show-origin --get-all core.autocrlf
            git config --show-origin --get-all core.symlinks
            git config --show-origin --get-all core.filemode
            echo "== line endings of the checkout"
            printf 'scripts/jig CR lines: '; grep -c "$(printf '\r')" scripts/jig
            printf 'scripts/lib/common.sh CR lines: '; grep -c "$(printf '\r')" scripts/lib/common.sh
            echo "== committed symlinks as checked out"
            git ls-files -s | awk '$1 == "120000" { print $4 }' | while read -r p; do
              if [ -L "$p" ]; then echo "link  $p -> $(readlink "$p")"; else echo "plain $p"; fi
            done
            echo "== ln -s behaviour"
            tmp=$(mktemp -d)
            mkdir "$tmp/target"
            ln -s "$tmp/target" "$tmp/link"; echo "ln -s exit=$?"
            if [ -L "$tmp/link" ]; then echo "ln -s makes a symlink"; else echo "ln -s makes a copy"; fi
            echo "== exec bit"
            touch "$tmp/f"; chmod 555 "$tmp"; touch "$tmp/g" 2>/dev/null && echo "chmod 555 dir: still writable" || echo "chmod 555 dir: read-only"
            chmod 755 "$tmp"
            echo "== fifo (tests/run.sh parallel mode needs one)"
            if command -v mkfifo >/dev/null 2>&1 && mkfifo "$tmp/fifo" 2>/dev/null && [ -p "$tmp/fifo" ]; then
              echo "mkfifo works"
            else
              echo "mkfifo unavailable"
            fi
            echo "== paths"
            echo "pwd=$(pwd)"
            echo "pwd -P=$(pwd -P)"
            echo "pwd -W=$(pwd -W 2>/dev/null)"
            echo "HOME=$HOME TMPDIR=${TMPDIR:-} TEMP=${TEMP:-}"
            echo "git toplevel=$(git rev-parse --show-toplevel)"
            echo "nproc=$(getconf _NPROCESSORS_ONLN 2>/dev/null)"
          } 2>&1 | tee "$PROBE/environment.log"

      - name: Test suite
        if: env.PROBE_TESTS == '1'
        run: |
          set +e
          # Parallel mode needs a FIFO; without one the whole run would be
          # lost to the runner rather than to the tests, so fall back to serial.
          tmp=$(mktemp -d)
          if command -v mkfifo >/dev/null 2>&1 && mkfifo "$tmp/fifo" 2>/dev/null; then
            export JIG_TEST_JOBS="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 1)"
          else
            export JIG_TEST_JOBS=1
          fi
          echo "JIG_TEST_JOBS=$JIG_TEST_JOBS" | tee "$PROBE/tests.log"
          start=$(date +%s)
          tests/run.sh >> "$PROBE/tests.log" 2>&1
          status=$?
          echo "tests/run.sh exit=$status seconds=$(( $(date +%s) - start ))" | tee -a "$PROBE/tests.log"
          grep -E '^(ok|FAIL)' "$PROBE/tests.log" | sort | uniq -c | sort -rn | head -n 5
          grep -E '^FAIL' "$PROBE/tests.log" > "$PROBE/tests-failed.txt"
          wc -l < "$PROBE/tests-failed.txt"

      # Each command reports its own exit code and the run continues, so one
      # early failure does not hide the rest.
      - name: Smoke — copy mode, tasks, worktree
        if: env.PROBE_SMOKE == '1'
        run: |
          set +e
          step() { echo; echo "\$ $*"; "$@"; echo "exit=$?"; }
          {
            work=$(mktemp -d)
            git -C "$work" init -q .
            git -C "$work" config user.name jig
            git -C "$work" config user.email jig@example.com
            git -C "$work" symbolic-ref HEAD refs/heads/main
            printf '# probe\n' > "$work/README.md"
            git -C "$work" add README.md
            git -C "$work" commit -q -m init
            cd "$work" || exit 1
            step "$GITHUB_WORKSPACE/scripts/jig" init --from "$GITHUB_WORKSPACE" --profiles generic,shell
            step .ai/scripts/jig knowledge new adr probe-crlf --domains core
            step .ai/scripts/jig knowledge check
            git add -A && git commit -q -m "jig init"
            # Mode 100644 here means Linux and macOS teammates cannot run them.
            echo "== modes recorded for executables committed from Windows"
            git ls-files -s .ai/scripts/jig .ai/scripts/jig-session-hook .ai/profiles/shell/verify.sh
            step .ai/scripts/jig status
            step .ai/scripts/jig verify
            step .ai/scripts/jig task new probe-a --class T1 --domains core
            step .ai/scripts/jig task start probe-a
            step .ai/scripts/jig task current
            git checkout -q main
            step .ai/scripts/jig task new probe-b --class T1 --domains core
            step .ai/scripts/jig task start probe-b --worktree
            step .ai/scripts/jig task list
            step .ai/scripts/jig task artifacts probe-b
            wt=$(git worktree list --porcelain | sed -n 's/^worktree //p' | tail -n 1)
            echo "worktree path from git: $wt"
            ls -la "$wt/.ai/workspace/tasks/" 2>&1
            step .ai/scripts/jig status
            step .ai/scripts/jig housekeeping --dry-run
            step .ai/scripts/jig housekeeping
            # The hook backgrounds housekeeping and returns at once. Remove the
            # stamp the explicit run above left, so the hook finds it due, then
            # give the background job time and look for what it leaves behind.
            rm -f .ai/runtime/last-housekeeping
            step .ai/scripts/jig-session-hook
            sleep 30
            ls -la .ai/runtime
            tail -n 5 .ai/runtime/housekeeping.log 2>&1
            step .ai/scripts/jig upgrade --dry-run

            # A teammate on Windows clones a project someone else initialised.
            # The jig repository has `.gitattributes` with eol=lf, but a project
            # does not, so this is where core.autocrlf reaches the installed
            # scripts.
            echo; echo "== fresh clone of the initialised project"
            clone=$(mktemp -d)/clone
            git clone -q "$work" "$clone"
            cd "$clone" || exit 1
            git config user.name jig
            git config user.email jig@example.com
            # grep may drop CR on Windows, so ask git and look at the bytes.
            echo "== line endings as git sees them"
            git ls-files --eol .ai/scripts/jig .ai/scripts/lib/common.sh .ai/manifest .ai/config.yaml .ai/knowledge/adr/
            echo "== first bytes of .ai/scripts/jig"
            od -c .ai/scripts/jig | sed -n 1,2p
            echo "== first bytes of .ai/manifest"
            od -c .ai/manifest | sed -n 1,3p
            step .ai/scripts/jig status
            # Manifest parsing: one edited framework file must show as drift.
            printf '# probe edit\n' >> .ai/profiles/generic/profile.yaml
            step .ai/scripts/jig status
            git checkout -q -- .ai/profiles/generic/profile.yaml
            # Frontmatter parsing on this checkout.
            step .ai/scripts/jig knowledge check
            step .ai/scripts/jig context resolve --no-task --catalog --domains core < /dev/null
            step .ai/scripts/jig verify
            step .ai/scripts/jig task new probe-c --class T1 --domains core
            step .ai/scripts/jig task list
            step .ai/scripts/jig upgrade --dry-run
          } 2>&1 | tee "$PROBE/smoke-copy.log"

      # Link mode twice: the project on C: (the temp dir, another drive than
      # the source on D:) and on D: beside the source. A relative link cannot
      # cross drives at all, so only the D: run isolates the path-form bug in
      # the computed link target.
      - name: Smoke — link mode
        if: env.PROBE_SMOKE == '1'
        run: |
          set +e
          step() { echo; echo "\$ $*"; "$@"; echo "exit=$?"; }
          link_probe() {
            work=$1
            git -C "$work" init -q .
            git -C "$work" config user.name jig
            git -C "$work" config user.email jig@example.com
            git -C "$work" symbolic-ref HEAD refs/heads/main
            printf '# probe\n' > "$work/README.md"
            git -C "$work" add README.md
            git -C "$work" commit -q -m init
            cd "$work" || return 1
            echo "project: $(pwd) ($(pwd -W))"
            step "$GITHUB_WORKSPACE/scripts/jig" init --from "$GITHUB_WORKSPACE" --link --profiles generic,shell
            echo "readlink .ai/scripts: $(readlink .ai/scripts 2>&1)"
            ls .ai/scripts/jig 2>&1
            step .ai/scripts/jig status
            step .ai/scripts/jig upgrade --dry-run
            step "$GITHUB_WORKSPACE/scripts/jig" init --from "$GITHUB_WORKSPACE" --link --profiles generic,shell
            cd "$GITHUB_WORKSPACE" || return 1
          }
          {
            echo "===== project on C: (temp)"
            link_probe "$(mktemp -d)"
            echo
            echo "===== project on D: (beside the source)"
            d="$(cygpath -u "$RUNNER_TEMP")/link-probe"
            mkdir -p "$d"
            link_probe "$d"
          } 2>&1 | tee "$PROBE/smoke-link.log"

      - name: Smoke — install.sh
        if: env.PROBE_SMOKE == '1'
        run: |
          set +e
          {
            bash install.sh --repository "https://github.com/${{ github.repository }}.git" --ref "${{ github.ref_name }}" --no-path
            echo "install.sh exit=$?"
            ls -la "$HOME/.local/bin" 2>&1
            "$HOME/.local/bin/jig" version
            echo "installed jig version exit=$?"
          } 2>&1 | tee "$PROBE/smoke-install.log"

      # --- v3: what a zero-config Windows installer could rely on -------------
      # The runner is an administrator with Git preinstalled, so this cannot show
      # a clean machine; it shows what the tools themselves do.

      - name: v3 — winget, rights, execution policy, git and bash locations
        if: env.PROBE_V3 == '1'
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path $env:PROBE | Out-Null
          & {
            "== winget"
            try { winget --version } catch { "winget: not available: $_" }
            "== running as administrator"
            ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            "== execution policy"
            Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String
            "== winget show Git.Git"
            try { winget show --id Git.Git -e --accept-source-agreements } catch { "failed: $_" }
            "== winget show Git.Git --scope user"
            try { winget show --id Git.Git -e --scope user --accept-source-agreements } catch { "failed: $_" }
            "== git and bash on PATH"
            Get-Command git -All -ErrorAction SilentlyContinue | Format-Table Source -AutoSize | Out-String
            Get-Command bash -All -ErrorAction SilentlyContinue | Format-Table Source -AutoSize | Out-String
            "git --exec-path: $(git --exec-path)"
          } *>&1 | Tee-Object -FilePath "$env:PROBE/v3-environment.log"

      # A junction needs no privilege. The questions: does jig's bash see it as
      # a link, and does `git worktree remove` (no --force) delete the link or
      # walk through it into the owner's workspace?
      - name: v3 — junction as the worktree workspace link
        if: env.PROBE_V3 == '1'
        run: |
          set +e
          step() { echo; echo "\$ $*"; "$@"; echo "exit=$?"; }
          {
            work=$(mktemp -d)
            git -C "$work" init -q .
            git -C "$work" config user.name jig
            git -C "$work" config user.email jig@example.com
            git -C "$work" symbolic-ref HEAD refs/heads/main
            printf '# probe\n' > "$work/README.md"
            git -C "$work" add README.md
            git -C "$work" commit -q -m init
            cd "$work" || exit 1
            "$GITHUB_WORKSPACE/scripts/jig" init --from "$GITHUB_WORKSPACE" --profiles generic,shell > /dev/null 2>&1
            git add -A && git commit -q -m "jig init"
            step .ai/scripts/jig task new probe-j --class T1 --domains core
            printf 'owner content\n' > .ai/workspace/tasks/probe-j/design.md

            wt="$work.worktrees/probe-j"
            step git worktree add -q -b task/probe-j "$wt"
            mkdir -p "$wt/.ai/workspace/tasks"
            link="$wt/.ai/workspace/tasks/probe-j"
            step cmd //c mklink /J "$(cygpath -w "$link")" "$(cygpath -w "$work/.ai/workspace/tasks/probe-j")"

            echo "== how bash sees the junction"
            if [ -L "$link" ]; then echo "-L: yes"; else echo "-L: no"; fi
            if [ -d "$link" ]; then echo "-d: yes"; else echo "-d: no"; fi
            echo "readlink: $(readlink "$link" 2>&1)"
            echo "cd -P: $(cd -P "$link" 2>&1 && pwd -P)"
            echo "find ! -type l: [$(find "$wt/.ai/workspace/tasks" -mindepth 1 -maxdepth 1 ! -type l)]"
            echo "find -type l: [$(find "$wt/.ai/workspace/tasks" -mindepth 1 -maxdepth 1 -type l)]"
            echo "read through it: $(cat "$link/design.md")"
            echo "git status in worktree: [$(git -C "$wt" status --porcelain)]"
            (cd "$wt" && step .ai/scripts/jig task artifacts probe-j)
            (cd "$wt" && step .ai/scripts/jig task current)

            echo "== git worktree remove, no --force"
            step git worktree remove "$wt"
            ls -la "$wt" 2>&1
            echo "== owner workspace afterwards"
            ls -la .ai/workspace/tasks/probe-j
            echo "design.md: $(cat .ai/workspace/tasks/probe-j/design.md 2>&1)"

            echo "== rm -rf on a junction (a naive cleanup)"
            j2="$(mktemp -d)/j2"
            cmd //c mklink /J "$(cygpath -w "$j2")" "$(cygpath -w "$work/.ai/workspace/tasks/probe-j")" > /dev/null
            step rm -rf "$j2"
            echo "design.md after rm -rf: $(cat .ai/workspace/tasks/probe-j/design.md 2>&1)"
          } 2>&1 | tee "$PROBE/v3-junction.log"

      # A wrapper next to .ai/scripts/jig for callers that are not bash: native
      # Codex runs agent commands through PowerShell. It finds Git Bash through
      # git itself, never through PATH, where bash may be WSL's launcher.
      - name: v3 — prepare a project with jig.cmd
        if: env.PROBE_V3 == '1'
        run: |
          set +e
          work=$(mktemp -d)
          git -C "$work" init -q .
          git -C "$work" config user.name jig
          git -C "$work" config user.email jig@example.com
          git -C "$work" symbolic-ref HEAD refs/heads/main
          printf '# probe\n' > "$work/README.md"
          git -C "$work" add README.md
          git -C "$work" commit -q -m init
          cd "$work" || exit 1
          "$GITHUB_WORKSPACE/scripts/jig" init --from "$GITHUB_WORKSPACE" --profiles generic,shell > /dev/null 2>&1
          .ai/scripts/jig knowledge new adr probe-wrapper --domains core
          printf '%s\r\n' \
            '@echo off' \
            'setlocal' \
            'for /f "delims=" %%G in ('"'"'git --exec-path'"'"') do set "JIG_GIT_EXEC=%%G"' \
            'set "JIG_BASH=%JIG_GIT_EXEC%\..\..\..\bin\bash.exe"' \
            'if not exist "%JIG_BASH%" (' \
            '  echo jig: Git Bash not found next to git 1>&2' \
            '  exit /b 127' \
            ')' \
            'set "JIG_SELF=%~dp0jig"' \
            'set "JIG_SELF=%JIG_SELF:\=/%"' \
            '"%JIG_BASH%" "%JIG_SELF%" %*' \
            'exit /b %ERRORLEVEL%' > .ai/scripts/jig.cmd
          cat .ai/scripts/jig.cmd
          pwd -W > "$PROBE/v3-project.txt"

      - name: v3 — jig.cmd from PowerShell 7
        if: env.PROBE_V3 == '1'
        shell: pwsh
        continue-on-error: true
        run: |
          Set-Location (Get-Content "$env:PROBE/v3-project.txt")
          & {
            "== Get-Command .ai/scripts/jig"
            Get-Command .ai/scripts/jig -ErrorAction SilentlyContinue | Format-List Name,Source,CommandType | Out-String
            "== .ai/scripts/jig status"
            .ai/scripts/jig status; "exit=$LASTEXITCODE"
            "== .ai\scripts\jig version"
            .ai\scripts\jig version; "exit=$LASTEXITCODE"
            "== exit code passes through"
            .ai/scripts/jig no-such-command; "exit=$LASTEXITCODE"
            "== arguments with spaces, quotes, & | and %"
            .ai/scripts/jig knowledge summary adr-0001-probe-wrapper 'pwsh a & b | c "quoted" 100% done'; "exit=$LASTEXITCODE"
            Get-Content .ai/knowledge/adr/0001-probe-wrapper.md -TotalCount 12
          } *>&1 | Tee-Object -FilePath "$env:PROBE/v3-wrapper-pwsh.log"

      - name: v3 — jig.cmd from Windows PowerShell 5.1
        if: env.PROBE_V3 == '1'
        shell: powershell
        continue-on-error: true
        run: |
          Set-Location (Get-Content "$env:PROBE/v3-project.txt")
          & {
            "== PowerShell $($PSVersionTable.PSVersion)"
            "== .ai/scripts/jig status"
            .ai/scripts/jig status; "exit=$LASTEXITCODE"
            "== arguments with spaces, quotes, & | and %"
            .ai/scripts/jig knowledge summary adr-0001-probe-wrapper 'ps51 a & b | c "quoted" 100% done'; "exit=$LASTEXITCODE"
            Get-Content .ai/knowledge/adr/0001-probe-wrapper.md -TotalCount 12
          } *>&1 | Tee-Object -FilePath "$env:PROBE/v3-wrapper-ps51.log"

      # --- v4 ------------------------------------------------------------------
      # v3's junction was never created: MSYS rewrote mklink's /J switch into a
      # path. Here PowerShell creates it and bash inspects it; bash then creates
      # one itself with argument conversion off, since jig itself runs in bash.

      - name: v4 — prepare a worktree for a junction
        run: |
          set +e
          work=$(mktemp -d)
          git -C "$work" init -q .
          git -C "$work" config user.name jig
          git -C "$work" config user.email jig@example.com
          git -C "$work" symbolic-ref HEAD refs/heads/main
          printf '# probe\n' > "$work/README.md"
          git -C "$work" add README.md
          git -C "$work" commit -q -m init
          cd "$work" || exit 1
          "$GITHUB_WORKSPACE/scripts/jig" init --from "$GITHUB_WORKSPACE" --profiles generic,shell > /dev/null 2>&1
          git add -A > /dev/null 2>&1
          git commit -q -m "jig init"
          .ai/scripts/jig task new probe-j --class T1 --domains core
          printf 'owner content\n' > .ai/workspace/tasks/probe-j/design.md
          wt="$work.worktrees/probe-j"
          git worktree add -q -b task/probe-j "$wt"
          mkdir -p "$wt/.ai/workspace/tasks"
          {
            echo "$work"
            echo "$wt"
            cygpath -w "$wt/.ai/workspace/tasks/probe-j"
            cygpath -w "$work/.ai/workspace/tasks/probe-j"
          } > "$PROBE/v4-paths.txt"
          cat "$PROBE/v4-paths.txt"

      - name: v4 — create the junction from PowerShell
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Get-Content "$env:PROBE/v4-paths.txt"
          & {
            New-Item -ItemType Junction -Path $p[2] -Target $p[3] | Format-List FullName,LinkType,Target | Out-String
            "LinkType: $((Get-Item $p[2]).LinkType)"
          } *>&1 | Tee-Object -FilePath "$env:PROBE/v4-junction-create.log"

      - name: v4 — inspect, use and remove the junction from bash
        run: |
          set +e
          step() { echo; echo "\$ $*"; "$@"; echo "exit=$?"; }
          {
            work=$(sed -n 1p "$PROBE/v4-paths.txt")
            wt=$(sed -n 2p "$PROBE/v4-paths.txt")
            link="$wt/.ai/workspace/tasks/probe-j"
            cd "$work" || exit 1
            echo "== how bash sees the junction"
            if [ -L "$link" ]; then echo "-L: yes"; else echo "-L: no"; fi
            if [ -d "$link" ]; then echo "-d: yes"; else echo "-d: no"; fi
            echo "readlink: [$(readlink "$link" 2>&1)]"
            echo "cd -P: [$(cd -P "$link" 2>&1 && pwd -P)]"
            echo "find ! -type l: [$(find "$wt/.ai/workspace/tasks" -mindepth 1 -maxdepth 1 ! -type l)]"
            echo "find -type l: [$(find "$wt/.ai/workspace/tasks" -mindepth 1 -maxdepth 1 -type l)]"
            echo "read through it: [$(cat "$link/design.md" 2>&1)]"
            printf 'written through the link\n' > "$link/notes.md"
            echo "owner sees the write: [$(cat .ai/workspace/tasks/probe-j/notes.md 2>&1)]"
            echo "git status in worktree: [$(git -C "$wt" status --porcelain)]"
            (cd "$wt" && step .ai/scripts/jig task artifacts probe-j)
            step .ai/scripts/jig task list

            echo "== git worktree remove, no --force"
            step git worktree remove "$wt"
            ls -la "$wt" 2>&1
            echo "== owner workspace afterwards"
            ls -la .ai/workspace/tasks/probe-j 2>&1

            echo "== bash creates a junction itself, argument conversion off"
            j2="$(mktemp -d)/j2"
            MSYS2_ARG_CONV_EXCL='*' cmd /c mklink /J "$(cygpath -w "$j2")" "$(cygpath -w "$work/.ai/workspace/tasks/probe-j")"
            echo "mklink exit=$?"
            if [ -L "$j2" ]; then echo "-L: yes"; else echo "-L: no"; fi
            echo "read through it: [$(cat "$j2/design.md" 2>&1)]"
            echo "== rm -rf on that junction"
            step rm -rf "$j2"
            ls -la .ai/workspace/tasks/probe-j 2>&1
          } 2>&1 | tee "$PROBE/v4-junction.log"

      # Git for Windows' Inno installer has a per-user mode. The runner is an
      # administrator, so this shows where it installs and that it works, not
      # that it needs no rights.
      - name: v4 — Git for Windows per-user install
        shell: pwsh
        continue-on-error: true
        run: |
          & {
            $url = 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/Git-2.55.0.3-64-bit.exe'
            $exe = Join-Path $env:RUNNER_TEMP 'git-installer.exe'
            $dir = Join-Path $env:LOCALAPPDATA 'Programs\GitProbe'
            $start = Get-Date
            Invoke-WebRequest -Uri $url -OutFile $exe
            "download seconds: $([int]((Get-Date) - $start).TotalSeconds)"
            $start = Get-Date
            $proc = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES','/SP-','/NOICONS','/CURRENTUSER',"/DIR=$dir"
            "installer exit: $($proc.ExitCode), seconds: $([int]((Get-Date) - $start).TotalSeconds)"
            "== files"
            "bash.exe: $(Test-Path (Join-Path $dir 'bin\bash.exe'))"
            "git.exe: $(Test-Path (Join-Path $dir 'cmd\git.exe'))"
            & (Join-Path $dir 'bin\bash.exe') -c 'echo "bash ok: $BASH_VERSION"'
            & (Join-Path $dir 'cmd\git.exe') --exec-path
            "== uninstall registration (HKCU means per-user)"
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Git_is1' -ErrorAction SilentlyContinue | Format-List DisplayName,InstallLocation | Out-String
            Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Git_is1' -ErrorAction SilentlyContinue | Format-List DisplayName,InstallLocation | Out-String
            "== user PATH after install"
            [Environment]::GetEnvironmentVariable('Path', 'User')
          } *>&1 | Tee-Object -FilePath "$env:PROBE/v4-git-user-install.log"

      # Last on purpose: it may replace the machine's git for anything after it.
      - name: v4 — winget install Git.Git --scope user
        shell: pwsh
        continue-on-error: true
        run: |
          & {
            winget install --id Git.Git -e --source winget --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            "exit=$LASTEXITCODE"
          } *>&1 | Tee-Object -FilePath "$env:PROBE/v4-winget-user.log"

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-probe-${{ matrix.setup }}
          path: probe-out/
